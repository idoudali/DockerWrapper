name: CLI Test

on: [pull_request, workflow_dispatch]

jobs:
  cli-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}
      - name: Build docker images
        run: |
          uv run ./repo-cli.py docker build ubuntu_base
          uv run ./repo-cli.py docker build ubuntu_derived
      - name: Run command
        run: uv run ./repo-cli.py docker ubuntu_base "echo 'Hello, World!'"
